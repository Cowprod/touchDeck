<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouchDeck — Administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/quartz/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
main{max-width:1280px}.preview{width:240px;height:240px;position:relative;overflow:hidden;background:#111827;border:7px solid #6c757d;border-radius:50%;margin:12px auto}.preview{touch-action:none;background-image:linear-gradient(to right,rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.1) 1px,transparent 1px);background-size:12.5% 12.5%}.piece.selected{outline:2px solid #f0ad4e;outline-offset:-2px}.piece{touch-action:none;user-select:none;position:absolute;display:flex;justify-content:center;align-items:center;text-align:center;overflow:hidden;font-size:14px;overflow-wrap:anywhere;background:#334155;border:1px solid #64748b}.form-control,.form-select{min-width:0}.input-group-text.field-label{width:25%;justify-content:flex-start}.save-warning{border-color:var(--bs-warning)!important}.save-success{border-color:var(--bs-success)!important}.save-danger{border-color:var(--bs-danger)!important}.card{margin-bottom:1rem}.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.toolbar .form-select{flex:1;min-width:140px}textarea{min-height:240px;font-family:ui-monospace,monospace!important;font-size:.85rem!important}
</style></head><body>
<nav class="navbar navbar-expand-lg bg-dark"><div class="container-fluid"><span class="navbar-brand"><i class="fa-solid fa-sliders me-2"></i>TouchDeck <small class="text-body-secondary">Administration</small></span><a class="btn btn-secondary" href="/"><i class="fa-solid fa-display me-1"></i>Simulateur</a></div></nav>
<main class="container-fluid py-4">
<div class="alert alert-info" id="state" role="status">Chargement de la configuration…</div>
<div class="row g-3">
<section class="col-lg-6"><div class="card h-100"><div class="card-header">Groupes</div><div class="card-body">
<div class="input-group mb-3"><span class="input-group-text field-label">Groupe</span><select class="form-select" id="group"></select><button class="btn btn-success" id="addGroup" title="Ajouter un groupe"><i class="fa-solid fa-plus"></i></button><button class="btn btn-danger" id="deleteGroup" title="Supprimer le groupe"><i class="fa-solid fa-trash"></i></button></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Nom</span><input class="form-control" id="groupName" maxlength="120"></div>
<div class="input-group"><span class="input-group-text field-label">Jeu de pages</span><select class="form-select" id="groupSet"></select></div>
</div></div></section>
<section class="col-lg-6"><div class="card h-100"><div class="card-header">Jeux de pages</div><div class="card-body">
<div class="input-group mb-3"><span class="input-group-text field-label">Jeu</span><select class="form-select" id="set"></select><button class="btn btn-success" id="addSet" title="Ajouter un jeu"><i class="fa-solid fa-plus"></i></button></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Profil</span><select class="form-select" id="profile"><option value="round-240">Rond 240 × 240 — 8 × 8</option></select></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Page</span><select class="form-select" id="page"></select><button class="btn btn-success" id="addPage" title="Ajouter une page"><i class="fa-solid fa-plus"></i></button><button class="btn btn-danger" id="deletePage" title="Supprimer la page"><i class="fa-solid fa-trash"></i></button></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Titre</span><input class="form-control" id="pageTitle" maxlength="120"></div>
<div class="input-group"><span class="input-group-text field-label">Visible</span><div class="form-check form-switch ms-3 align-self-center"><input class="form-check-input" type="checkbox" id="visible" aria-label="Page visible"></div></div>
</div></div></section>
<section class="col-lg-6"><div class="card h-100"><div class="card-header">Composants de la page</div><div class="card-body">
<div class="input-group mb-3"><span class="input-group-text field-label">Composant</span><select class="form-select" id="component"></select><button class="btn btn-danger" id="deleteComponent" title="Supprimer le composant"><i class="fa-solid fa-trash"></i></button></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Type</span><input class="form-control" id="componentType" readonly></div>
<div class="input-group mb-3"><span class="input-group-text field-label">Texte</span><input class="form-control" id="componentText" maxlength="250"></div>
<div class="row g-2 mb-3"><div class="col-6"><div class="input-group"><span class="input-group-text">X</span><input class="form-control" type="number" id="componentX" min="0" max="7"></div></div><div class="col-6"><div class="input-group"><span class="input-group-text">Y</span><input class="form-control" type="number" id="componentY" min="0" max="7"></div></div><div class="col-6"><div class="input-group"><span class="input-group-text">Largeur</span><input class="form-control" type="number" id="componentW" min="1" max="8"></div></div><div class="col-6"><div class="input-group"><span class="input-group-text">Hauteur</span><input class="form-control" type="number" id="componentH" min="1" max="8"></div></div></div>
<div class="btn-group"><button class="btn btn-success" id="addLabel"><i class="fa-solid fa-plus me-1"></i>Label</button><button class="btn btn-success" id="addButton"><i class="fa-solid fa-plus me-1"></i>Bouton</button><button class="btn btn-success" id="addToggle"><i class="fa-solid fa-plus me-1"></i>Toggle</button></div>
<details class="mt-3"><summary class="small">JSON (diagnostic)</summary><textarea class="form-control mt-2" id="components" spellcheck="false"></textarea></details>
</div></div></section>
<section class="col-lg-6"><div class="card h-100"><div class="card-header">Aperçu</div><div class="card-body"><div id="preview" class="preview"></div><p class="small text-body-secondary">Aperçu local ; validation de la grille côté serveur.</p></div></div></section>
</div>
</main><script>let config=null;const $=id=>document.getElementById(id);const validId=id=>/^[a-zA-Z0-9_-]{1,80}$/.test(id);
function currentSet(){return config?.pageSets.find(x=>x.id===$('set').value)}
function currentPage(){return currentSet()?.pages.find(x=>x.id===$('page').value)}
function currentGroup(){return config?.groups.find(x=>x.id===$('group').value)}
function options(element,items,selected){element.replaceChildren();for(const item of items){const option=new Option(item.label,item.id);element.add(option)}if(selected&&items.some(x=>x.id===selected))element.value=selected}
function refresh(selected={}){if(!config)return;
options($('group'),config.groups.map(x=>({id:x.id,label:x.name})),selected.group??$('group').value);
options($('set'),config.pageSets.map(x=>({id:x.id,label:x.id})),selected.set??$('set').value);
refreshGroup();refreshSet(selected.page);
}
function refreshGroup(){const g=currentGroup();$('groupName').value=g?.name??'';options($('groupSet'),config.pageSets.map(x=>({id:x.id,label:x.id})),g?.pageSetId)}
function refreshSet(selectedPage){const s=currentSet();$('profile').value=s?.profileId??'round-240';options($('page'),(s?.pages??[]).map(x=>({id:x.id,label:x.title})),selectedPage);refreshPage()}
function refreshPage(){const p=currentPage();$('pageTitle').value=p?.title??'';$('visible').checked=!!p?.visible;$('components').value=JSON.stringify(p?.components??[],null,2);refreshComponents();renderPreview()}
function currentComponent(){return currentPage()?.components.find(x=>x.id===$('component').value)}
function refreshComponents(selected){const p=currentPage();options($('component'),(p?.components??[]).map(x=>({id:x.id,label:x.type+' — '+(x.text??x.id)})),selected??$('component').value);refreshComponent()}
function refreshComponent(){const item=currentComponent();for(const div of $('preview').children)div.classList.toggle('selected',div.title==='Déplacer '+item?.id);for(const key of ['Type','Text','X','Y','W','H']){$('component'+key).value=item?.[key==='Type'?'type':key==='Text'?'text':key.toLowerCase()]??'';$('component'+key).disabled=!item}$('deleteComponent').disabled=!item}
function renderPreview(){const view=$('preview');view.replaceChildren();const items=currentPage()?.components??[];for(const item of items){const div=document.createElement('div');div.className='piece'+(item.id===$('component').value?' selected':'');div.style.left=(item.x/8*100)+'%';div.style.top=(item.y/8*100)+'%';div.style.width=(item.w/8*100)+'%';div.style.height=(item.h/8*100)+'%';div.textContent=item.text??item.type;div.title='Déplacer '+item.id;div.style.cursor='grab';div.onpointerdown=event=>{if(event.button!==0)return;event.preventDefault();$('component').value=item.id;refreshComponent();const startX=event.clientX,startY=event.clientY,originX=item.x,originY=item.y;const size=view.getBoundingClientRect();let moved=false;div.setPointerCapture(event.pointerId);div.classList.add('selected');div.onpointermove=e=>{const x=Math.max(0,Math.min(8-item.w,originX+Math.round((e.clientX-startX)/size.width*8)));const y=Math.max(0,Math.min(8-item.h,originY+Math.round((e.clientY-startY)/size.height*8)));if(x!==item.x||y!==item.y){item.x=x;item.y=y;moved=true;div.style.left=(x/8*100)+'%';div.style.top=(y/8*100)+'%';$('componentX').value=x;$('componentY').value=y}};div.onpointerup=()=>{div.onpointermove=null;div.onpointerup=null;if(moved){$('components').value=JSON.stringify(currentPage().components,null,2);dirty(null)}renderPreview()};div.onpointercancel=()=>{div.onpointermove=null;div.onpointerup=null;renderPreview()}};view.append(div)}}
>
