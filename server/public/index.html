<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>touchDeck · simulateur</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@font-face{font-family:'IBM Plex Mono';src:url('/assets/fonts/ibm-plex-mono.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap;}

:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#111827;color:#f9fafb}main{max-width:760px;margin:36px auto;padding:0 20px}h1{font-size:1.5rem}.meta{color:#9ca3af}button{padding:10px 18px;background:#2563eb;border:0;border-radius:8px;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}body.embedded main{margin:5px auto;padding:0 4px}body.embedded h1{display:none}body.embedded .meta{display:none}body.embedded .device{border-width:5px;margin:8px auto}body.embedded .controls button{padding:6px 8px}body.embedded .status{font-size:12px;margin-top:6px}.device{width:240px;height:240px;border:12px solid #374151;border-radius:50%;background:#0f172a;position:relative;overflow:hidden;margin:28px auto;box-shadow:0 12px 40px #0008}.component{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-size:15px;overflow-wrap:anywhere}.controls{display:flex;justify-content:center;gap:12px}.status{margin-top:24px;text-align:center}.pill{font-size:12px;color:#9ca3af}
</style></head><body><main><h1>touchDeck <span class="pill">simulateur Web</span></h1><p class="meta">Navigation indépendante · serveur autoritaire</p><div class="device" id="screen" aria-label="Écran simulé"></div><div class="controls"><button id="assign">Rejoindre la démo</button><button id="prev">← Précédente</button><button id="next">Suivante →</button></div><p class="status" id="status">Connexion…</p></main>
<script>
const params=new URLSearchParams(location.search),embedded=params.get('embedded')==='1';
const simId=params.get('simId'),key=embedded&&/^web-sim-[a-zA-Z0-9_-]{1,60}$/.test(simId??'')?'touchdeck.client.'+simId:'touchdeck.clientId';
let id=embedded&&key!=='touchdeck.clientId'?simId:localStorage.getItem(key);
if(!id){id='web-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(key,id)}
if(embedded){document.body.classList.add('embedded');document.querySelector('h1').textContent='Simulateur';document.getElementById('assign').style.display='none'}
const screen=document.getElementById('screen'),status=document.getElementById('status');let socket;let currentPageId=null,currentPageRevision=null;
function send(message){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(message))}
function paintEspGauge(element,item,ratio){
 const width=Math.max(1,Math.round(item.w)),height=Math.max(1,Math.round(item.h));
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
 canvas.style.cssText='display:block;width:100%;height:100%;image-rendering:pixelated';
 const ctx=canvas.getContext('2d'),image=ctx.createImageData(width,height);
 const rgb565=hex=>{const n=parseInt((hex||'#000000').replace('#',''),16)||0;return ((n>>19)<<11)|(((n>>10)&63)<<5)|((n>>3)&31)};
 const background=item.backgroundColor?rgb565(item.backgroundColor):0x3186;
 const foreground=rgb565(item.textColor||'#ffffff'),track=0x8410;
 const cx=Math.floor(width/2),cy=Math.floor(height/2),radius=Math.max(3,Math.floor(Math.min(width,height)/2)-5);
 const outer=radius+2.5,inner=Math.max(0,radius-2.5);
 const start=item.display==='arc'?135:0,extent=item.display==='arc'?270:360,progress=extent*ratio;
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  let active=0,inactive=0;
  for(let sy=0;sy<2;sy++)for(let sx=0;sx<2;sx++){
   const dx=x+(sx?.75:.25)-cx,dy=y+(sy?.75:.25)-cy,dist2=dx*dx+dy*dy;
   if(dist2<inner*inner||dist2>outer*outer)continue;
   let deg=Math.atan2(dy,dx)*180/Math.PI+90-start;
   while(deg<0)deg+=360;
   if(deg>=extent)continue;
   if(deg<progress)active++;else inactive++;
  }
  const inv=4-active-inactive;
  const red=(((foreground>>11)*active+(track>>11)*inactive+(background>>11)*inv+2)/4)|0;
  const green=(((((foreground>>5)&63)*active+((track>>5)&63)*inactive+((background>>5)&63)*inv+2)/4)|0);
  const blue=(((foreground&31)*active+(track&31)*inactive+(background&31)*inv+2)/4)|0;
  const offset=(y*width+x)*4;
  image.data[offset]=Math.round(red*255/31);image.data[offset+1]=Math.round(green*255/63);
  image.data[offset+2]=Math.round(blue*255/31);image.data[offset+3]=255;
 }
 ctx.putImageData(image,0,0);element.append(canvas);
}
function paintVisual(element,item){
 element.replaceChildren();
 if(['Gauge','Progress','Slider'].includes(item.type)){
  const min=item.min??0,max=item.max??100,value=Math.max(min,Math.min(max,item.value??0)),ratio=(value-min)/(max-min||1);
  element.dataset.min=min;element.dataset.max=max;element.dataset.orientation=item.orientation??'horizontal';
  const track=document.createElement('div'),fill=document.createElement('div');
  track.style.cssText='position:relative;width:85%;height:65%;overflow:hidden;border-radius:6px;background:#475569';
  if(item.display==='circle'||item.display==='arc'){
   paintEspGauge(element,item,ratio);
   element.setAttribute('aria-valuenow',String(value));element.setAttribute('aria-valuemin',String(min));element.setAttribute('aria-valuemax',String(max));
   return;
  }else{
   // Match the ESP32 fillRect geometry exactly: square ends, integer pixels.
   const width=Math.round(item.w),height=Math.round(item.h);
   const vertical=item.orientation==='vertical';
   const bx=vertical?Math.floor(width/3):4;
   const bw=vertical?Math.max(3,Math.floor(width/3)):Math.max(1,width-8);
   const by=vertical?4:Math.floor(height/3);
   const bh=vertical?Math.max(1,height-8):Math.max(3,Math.floor(height/3));
   const filled=Math.floor((vertical?bh:bw)*ratio);
   track.style.cssText='position:absolute;left:'+bx+'px;top:'+by+'px;width:'+bw+'px;height:'+bh+'px;background:#848284;border-radius:0;overflow:hidden';
   // ESP32 uses RGB565 0x8410 as the track color.
   fill.style.cssText=vertical?'position:absolute;bottom:0;left:0;width:100%;height:'+filled+'px;background:currentColor;border-radius:0':'position:absolute;top:0;left:0;width:'+filled+'px;height:100%;background:currentColor;border-radius:0';
   track.append(fill);
  }
  element.append(track);element.setAttribute('aria-valuenow',String(value));element.setAttribute('aria-valuemin',String(min));element.setAttribute('aria-valuemax',String(max));
  return;
 }
 if(item.type==='IconBar'){
  element.style.gap='2px';
  for(const icon of item.icons??[]){const glyph=document.createElement('span');glyph.style.cssText='flex:1;min-width:0;height:70%;background:currentColor;mask-size:contain;mask-position:center;mask-repeat:no-repeat;-webkit-mask-size:contain;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat';const url='/api/icons/preview/'+icon.split('/').map(encodeURIComponent).join('/')+'?v=96';glyph.style.maskImage='url("'+url+'")';glyph.style.webkitMaskImage=glyph.style.maskImage;element.append(glyph)}
  return;
 }
 if(item.type==='Icon'&&item.icon){const glyph=document.createElement('span');glyph.setAttribute('role','img');glyph.setAttribute('aria-label',item.icon);glyph.style.cssText='display:block;width:75%;height:75%;background-color:currentColor;mask-size:contain;mask-position:center;mask-repeat:no-repeat;-webkit-mask-size:contain;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat';const iconUrl='/api/icons/preview/'+item.icon.split('/').map(encodeURIComponent).join('/')+'?v=96';glyph.style.maskImage='url("'+iconUrl+'")';glyph.style.webkitMaskImage=glyph.style.maskImage;element.append(glyph)}else element.textContent=item.text??'';
}
function render(data){screen.replaceChildren();currentPageId=data.page?.id??null;currentPageRevision=data.pageRevision;if(!data.page||!data.profile){status.textContent='Client non affecté ou aucune page visible';return}
const {width,height}=data.profile;
screen.style.width=width+'px';screen.style.height=height+'px';screen.style.borderRadius=data.profile.shape==='round'?'50%':'12px';screen.style.backgroundColor=data.page.backgroundColor??'#0f172a';
for(const item of data.page.components){const element=document.createElement('div');element.className='component';element.dataset.componentId=item.id;element._item=item;element.dataset.type=item.type;element.dataset.disabled=item.disabled?'1':'0';element.style.left=item.x+'px';element.style.top=item.y+'px';element.style.width=item.w+'px';element.style.height=item.h+'px';element.style.backgroundColor=item.backgroundColor??'transparent';element.style.borderRadius=item.radius===2?Math.min(item.w,item.h)/2+'px':item.radius===0?'0px':'4px';element.style.color=item.textColor??'#f9fafb';element.style.fontSize=(item.fontSize??15)+'px';element.style.fontFamily="'IBM Plex Mono',monospace";element.style.opacity=item.disabled?'.45':'1';element.style.outline=item.active?'2px solid #f8f9fa':'none';paintVisual(element,item);screen.append(element)}
status.textContent=data.page.title+' · '+id.slice(0,8)+' · groupe '+(data.groupId??'aucun');
}
let simReadySent=false;
function connect(){simReadySent=false;socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');
socket.onopen=()=>{status.textContent='Connecté';send({type:'hello',clientId:id})};
socket.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==='welcome'&&embedded&&window.parent!==window&&!simReadySent){simReadySent=true;window.parent.postMessage({type:'touchdeck-sim-ready',clientId:id},location.origin);}if(data.type==='welcome'&&data.groupId===null)render({type:'page',groupId:null,page:null,profile:null,pageRevision:0});if(data.type==='page')render(data);
if(data.type==='component_update'&&data.pageId===currentPageId&&data.pageRevision===currentPageRevision){
 for(const change of data.changes??[]){const element=[...screen.children].find(child=>child.dataset.componentId===change.id);if(element){if(['Gauge','Progress','Slider'].includes(element.dataset.type)){const item=element._item;item.value=change.value??item.value;paintVisual(element,item)}else element.textContent=change.text??''}}
}
if(data.type==='interaction_result'){const el=[...screen.children].find(child=>child.dataset.componentId===data.componentId);if(el&&data.status!=='pending'){el.dataset.pending='0';el.style.opacity=el.dataset.disabled==='1'?'.45':'1'}status.textContent=data.status==='rejected'?'Action non exécutée : '+data.reason:'Action : '+data.status}
if(data.type==='error')status.textContent='Erreur : '+data.code};
socket.onclose=()=>{screen.replaceChildren();currentPageId=null;currentPageRevision=null;status.textContent='Déconnecté';setTimeout(connect,3000)}}
document.getElementById('assign').onclick=()=>send({type:'assign',groupId:'demo'});
document.getElementById('prev').onclick=()=>send({type:'navigate',direction:'previous'});
document.getElementById('next').onclick=()=>send({type:'navigate',direction:'next'});
let pointerStart=null,requestCounter=0;
screen.style.touchAction='none';
screen.addEventListener('pointerdown',event=>{
 if(event.button!==0)return;
 pointerStart={x:event.clientX,y:event.clientY,time:Date.now(),pointerId:event.pointerId};
});
screen.addEventListener('pointerup',event=>{
 const start=pointerStart;pointerStart=null;
 if(!start||start.pointerId!==event.pointerId||Date.now()-start.time>=1000)return;
 const dx=event.clientX-start.x,dy=event.clientY-start.y;
 const origin=document.elementFromPoint(start.x,start.y)?.closest('.component');
 if(origin&&screen.contains(origin)&&origin.dataset.type==='Slider'){slide(origin,event);return}
 if(Math.abs(dx)>=35&&Math.abs(dx)>Math.abs(dy)){send({type:'navigate',direction:dx<0?'next':'previous'});return}
 if(Math.abs(dx)>=15||Math.abs(dy)>=15)return;
 const element=document.elementFromPoint(event.clientX,event.clientY)?.closest('.component');
 if(element&&screen.contains(element)){if(element.dataset.type==='Slider')slide(element,event);else activate(element)}
});
screen.addEventListener('pointercancel',()=>{pointerStart=null});
function slide(el,event){
 if(el.dataset.disabled==='1'||el.dataset.pending==='1'||socket?.readyState!==WebSocket.OPEN)return;
 const rect=el.getBoundingClientRect(),min=Number(el.dataset.min),max=Number(el.dataset.max);
 const ratio=el.dataset.orientation==='vertical'?1-(event.clientY-rect.top)/rect.height:(event.clientX-rect.left)/rect.width;
 const value=Math.round(min+Math.max(0,Math.min(1,ratio))*(max-min));
 el.dataset.pending='1';send({type:'interact',pageId:currentPageId,pageRevision:currentPageRevision,componentId:el.dataset.componentId,requestId:'web-'+(++requestCounter),value});
}
function activate(el){
 if(!['Button','Toggle','Label','Icon'].includes(el.dataset.type)||el.dataset.disabled==='1'||el.dataset.pending==='1')return;
 if(socket?.readyState!==WebSocket.OPEN){status.textContent='Action impossible : WebSocket déconnecté';return}
 const requestId='web-'+(++requestCounter);
 el.dataset.pending='1';el.style.opacity='.5';
 send({type:'interact',pageId:currentPageId,pageRevision:currentPageRevision,componentId:el.dataset.componentId,requestId});
 status.textContent='Commande envoyée : '+el.dataset.componentId;
 setTimeout(()=>{if(el.dataset.pending==='1'){el.dataset.pending='0';el.style.opacity='1'}},5000);
}
connect();
</script></body></html>
